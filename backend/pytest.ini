# Where the suite's throwaway directories go.
#
# Without this, pytest builds them under the system temp root as numbered
# folders (pytest-of-<user>/pytest-N) plus a `pytest-current` symlink, and at
# the end of every session it walks that root to delete the older ones. On
# Windows that walk hits `PermissionError: [WinError 5]` on `pytest-current`,
# which crashes pytest AFTER every test has passed - a green run that exits
# non-zero, and a release gate that refuses it. Worse, the folders it failed
# to delete stay, so each run has more to walk than the last: this is why the
# suite kept getting slower.
#
# An explicit basetemp is wiped and recreated at the start of the session
# instead: no numbered folders, no symlink, no end-of-session walk, nothing
# left behind. (2.2.2)
[pytest]
addopts = --basetemp=.pytest-tmp
