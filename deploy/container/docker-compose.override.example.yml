# Your own settings for the container. Copy this file to
# docker-compose.override.yml next to it and edit that copy - git ignores
# it, so the clone stays clean and update.sh can always fast-forward.
# update.sh and `bash update.sh compose ...` read it automatically.
services:
  app:
    environment:
      # SLQ Hub (0.4.0) - normally set in Settings → AI server instead.
      # Pinned here = locked there. Keep the key out of git: this file is ignored.
      # APP_AI_SERVER: "hub"
      # APP_HUB_URL: "http://30.11.0.140"
      # APP_HUB_KEY: "slqhub_..."
      # The old GPU VM. Pinned here = locked in Settings. Leave them out to
      # set them in the Settings page instead.
      APP_OLLAMA_URL: "http://30.11.0.104:11434"
      APP_COMFY_URL: "http://30.11.0.104:8188"
      # APP_SEARXNG_URL: "http://30.11.0.50:8888"
    # A folder on the host instead of the named volume (easier to back up).
    # The folder must be owned by uid 1000:
    #   mkdir -p /srv/familylog/data && chown -R 1000:1000 /srv/familylog/data
    # volumes:
    #   - /srv/familylog/data:/data
    # Another port on the host:
    # ports: !override
    #   - "8082:8080"
