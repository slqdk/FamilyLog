# FamilyLog on the Proxmox server - see docs/CONTAINER.md.
# Do not edit this file on the host - put your settings in
# docker-compose.override.yml (see the .example next to it). From the clone:
#   bash update.sh compose up -d --build     first start
#   bash update.sh                           updates
name: familylog
services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: familylog:latest
    container_name: familylog
    restart: unless-stopped
    ports:
      - "8081:8080"            # Nginx Proxy Manager points here (SLQ has 8080)
    volumes:
      - familylog-data:/data   # app.db, settings.json, FamilyMap photos, logs
    environment:
      TZ: Europe/Copenhagen
      APP_DATA_DIR: /data
      # Optional pins. Set here (or in the override) and the Settings page
      # shows the field locked; leave them out and set them in Settings.
      # APP_OLLAMA_URL: "http://30.11.0.104:11434"
      # APP_COMFY_URL: "http://30.11.0.104:8188"

volumes:
  familylog-data:
    # A named volume. To keep the data in a folder on the host instead
    # (easier to back up), set the volume in docker-compose.override.yml.
